# Configuration for cargo-deny, run by .github/workflows/security.yml.
#
# Three questions, none of which the compiler answers: is a dependency subject
# to a published advisory, is its licence compatible with shipping this under
# MIT, and did it come from somewhere other than crates.io or cellweave.

[advisories]
version = 2
# An entry here is a decision to live with a known vulnerability, and it
# carries the advisory identifier and the reason.
ignore = [
    # ttf-parser is unmaintained, with no replacement released. cellstage
    # measures the width of words with it, and winit draws the window's title
    # bar on Wayland with it, both in fonts of the system; no font from
    # outside is ever parsed with it. To revisit when a maintained parser
    # replaces it in winit and fontdb.
    { id = "RUSTSEC-2026-0192", reason = "only the system's fonts are parsed with it" },
    # ruzstd 0.8 can be made to allocate without bound by a crafted input,
    # fixed in 0.9.1, which bevy_image 0.20 does not accept yet. bevy_image
    # uses it only to decompress KTX2 textures, and cellstage loads none: its
    # textures are painted in code. To revisit when Bevy moves to ruzstd 0.9.
    { id = "RUSTSEC-2026-0344", reason = "bevy_image decompresses only KTX2 textures with it, and none is loaded" },
]

[licenses]
version = 2
# Derived from the dependency tree as it actually stands, not from a template.
# A new licence appearing here is a fact worth being told about.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
    # Bevy, winit, the graphics stack, and resvg's renderer.
    "Zlib",
    "MIT-0",
    "ISC",
    "BSD-3-Clause",
    # The fonts egui draws its panels with, bundled into the binary: free to
    # embed and redistribute, which is all a window does with them.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla's list of certificate authorities, which ureq trusts when it
    # fetches a protein from the PDB or AlphaFold: a permissive data licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A dependency pinned to "*" takes whatever version the registry happens to hold,
# which is a supply chain risk worth refusing.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# cellweave's crates come from its repository, by a release tag.
allow-git = ["https://github.com/ngodzik/cellweave"]
