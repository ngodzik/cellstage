<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" data-what="the first week: from the fertilised egg to the blastocyst, inside the zona pellucida">
<defs><radialGradient id="t-zygote-to-blastocyst-zona" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f6f9fd"/><stop offset="1" stop-color="#dbe6f2"/></radialGradient><radialGradient id="t-zygote-to-blastocyst-egg" cx="0.42" cy="0.38" r="0.7"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f2d6b4"/></radialGradient><radialGradient id="t-zygote-to-blastocyst-tropho" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#e4f4dc"/><stop offset="1" stop-color="#9fcf8a"/></radialGradient><radialGradient id="t-zygote-to-blastocyst-icm" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#f7d7ea"/><stop offset="1" stop-color="#cf7fae"/></radialGradient><radialGradient id="t-zygote-to-blastocyst-cavity" cx="0.5" cy="0.55" r="0.6"><stop offset="0" stop-color="#f3f9fe"/><stop offset="1" stop-color="#d9eaf7"/></radialGradient></defs>
<style>
.t-zygote-to-blastocyst-zona { fill: url(#t-zygote-to-blastocyst-zona); stroke: #a9bdd6; stroke-width: 1.5; }
.t-zygote-to-blastocyst-egg { fill: url(#t-zygote-to-blastocyst-egg); stroke: #c79a6c; stroke-width: 2; }
.t-zygote-to-blastocyst-pronuc { fill: url(#h-nucleus); stroke: #6b4fae; stroke-width: 1.5; }
.t-zygote-to-blastocyst-tropho { fill: url(#t-zygote-to-blastocyst-tropho); stroke: #5c9a48; stroke-width: 1.5; }
.t-zygote-to-blastocyst-icm { fill: url(#t-zygote-to-blastocyst-icm); stroke: #9c4d7d; stroke-width: 1.5; }
.t-zygote-to-blastocyst-cavity { fill: url(#t-zygote-to-blastocyst-cavity); stroke: none; }
.t-zygote-to-blastocyst-nuc { fill: #8a69c8; opacity: 0.75; }
.t-zygote-to-blastocyst-polar { fill: #f6e3c8; stroke: #c79a6c; stroke-width: 1.2; }
.t-zygote-to-blastocyst-step { fill: none; stroke: #9aa3b5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
</style>
