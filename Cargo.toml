[package]
name         = "cellstage"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
authors      = ["Nicolas Godzik"]
license      = "MIT"
description  = "A stage an agent draws biology on: proteins, cells, tissues, and cellweave's simulations, driven over MCP."
publish      = false

[dependencies]
cellweave-core   = { git = "https://github.com/ngodzik/cellweave", tag = "v0.3.0", version = "0.3.0" }
cellweave-engine = { git = "https://github.com/ngodzik/cellweave", tag = "v0.3.0", version = "0.3.0" }
cellweave-io     = { git = "https://github.com/ngodzik/cellweave", tag = "v0.3.0", version = "0.3.0" }
anyhow           = "1"
base64           = "0.22"
png              = "0.18"
rayon            = "1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
ureq             = "3"
bevy = { version = "0.20.0", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit", "bevy_window",
    "x11", "wayland", "bevy_render", "bevy_core_pipeline", "bevy_asset", "bevy_color", "hdr",
    "bevy_post_process", "bevy_camera", "bevy_mesh", "bevy_image", "bevy_shader", "bevy_material",
    "bevy_pbr", "bevy_light", "bevy_anti_alias", "mouse", "keyboard", "png",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
resvg = "0.49.0"
ttf-parser = "0.25"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
